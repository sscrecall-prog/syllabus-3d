# GitLab CI/CD Pipeline for syllabus-3d
image: node:20-alpine

stages:
  - lint
  - test
  - build

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

before_script:
  - npm ci --prefer-offline

# 1. Static Type Checking & Linting
lint:
  stage: lint
  script:
    - npx tsc --noEmit

# 2. Automated Unit Tests
test:
  stage: test
  script:
    - npx vitest run
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: junit.xml

# 3. Production Build
build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
